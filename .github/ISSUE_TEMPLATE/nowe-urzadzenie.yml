name: Nowe urządzenie
description: Urządzenie, które UplinkView zna tylko częściowo – z raportem urządzenia z panelu (Urządzenie → Przygotuj raport).
title: "Nowe urządzenie: "
labels: ["nowe-urządzenie"]
body:
  - type: markdown
    attributes:
      value: |
        Dziękujemy! Pola niżej wypełnia panel UplinkView. **Dołącz pobrany plik raportu** (`uplinkview-report-….json`)
        w polu „Raport” – przeciągnij go albo wybierz. Raport jest zanonimizowany na Twoim serwerze (adresy IP i MAC,
        nazwy, SSID, numery seryjne), ale przejrzyj go przed wysłaniem – zgłoszenia są publiczne.
  - type: input
    id: model
    attributes:
      label: Model i wersja firmware
      placeholder: np. MikroTik hAP ax³, RouterOS 7.18
    validations:
      required: true
  - type: input
    id: object_id
    attributes:
      label: sysObjectID
  - type: input
    id: descr
    attributes:
      label: sysDescr (zanonimizowany)
  - type: input
    id: driver
    attributes:
      label: Driver wybrany przez UplinkView
  - type: input
    id: version
    attributes:
      label: Wersja UplinkView
  - type: textarea
    id: notes
    attributes:
      label: Uwagi
      description: Co jest odczytywane źle albo czego brakuje, np. „port 5 to WAN”, „dwa dyski w RAID 1”.
  - type: textarea
    id: report
    attributes:
      label: Raport
      description: Przeciągnij tu plik `uplinkview-report-….json`.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Zgoda
      options:
        - label: Zgadzam się, żeby zanonimizowany zrzut trafił do repozytorium UplinkView jako dane testowe (fixture).
          required: true
